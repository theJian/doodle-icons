name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="${RELEASE_TAG#v}"
          if [[ "v${package_version}" != "${RELEASE_TAG}" ]]; then
            echo "Release tag must use the v<version> format; received ${RELEASE_TAG}." >&2
            exit 1
          fi

          for package_dir in packages/react packages/react-native packages/vue; do
            manifest_version="$(node -p "require('./${package_dir}/package.json').version")"
            if [[ "${manifest_version}" != "${package_version}" ]]; then
              echo "${package_dir}/package.json is version ${manifest_version}, expected ${package_version}." >&2
              exit 1
            fi
          done

      - name: Build and test
        run: |
          bun run build
          bun run test

      - name: Check package contents
        run: |
          npm pack --dry-run --workspace @doodle-icons/react
          npm pack --dry-run --workspace @doodle-icons/react-native
          npm pack --dry-run --workspace @doodle-icons/vue

      - name: Publish React package
        run: npm publish --access public
        working-directory: packages/react

      - name: Publish React Native package
        run: npm publish --access public
        working-directory: packages/react-native

      - name: Publish Vue package
        run: npm publish --access public
        working-directory: packages/vue
