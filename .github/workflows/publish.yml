name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to publish or retry (for example, v0.1.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="${RELEASE_TAG#v}"
          if [[ "v${package_version}" != "${RELEASE_TAG}" ]]; then
            echo "Release tag must use the v<version> format; received ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${package_version}" == *-* ]]; then
            echo "Manual publishing only supports stable release tags; received ${RELEASE_TAG}." >&2
            exit 1
          fi

          for package_dir in packages/react packages/react-native packages/vue; do
            manifest_version="$(node -p "require('./${package_dir}/package.json').version")"
            if [[ "${manifest_version}" != "${package_version}" ]]; then
              echo "${package_dir}/package.json is version ${manifest_version}, expected ${package_version}." >&2
              exit 1
            fi
          done

      - name: Build and test
        run: |
          bun run build
          bun run test

      - name: Check package contents
        run: |
          npm pack --dry-run --workspace @doodle-icons/react
          npm pack --dry-run --workspace @doodle-icons/react-native
          npm pack --dry-run --workspace @doodle-icons/vue

      - name: Publish npm packages
        run: |
          for package_dir in packages/react packages/react-native packages/vue; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            package_spec="${package_name}@${package_version}"

            if registry_result="$(npm view "${package_spec}" version --json --silent)"; then
              echo "${package_spec} is already published; skipping."
              continue
            fi

            registry_error="$(node -p "JSON.parse(process.argv[1]).error?.code ?? ''" "${registry_result}")"
            if [[ "${registry_error}" != "E404" ]]; then
              echo "Could not check ${package_spec} on npm (${registry_error}); stopping." >&2
              exit 1
            fi

            (cd "${package_dir}" && npm publish --access public)
          done
